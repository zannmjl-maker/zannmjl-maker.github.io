<body><!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jadwal Operasional Jus Kampus</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #222;

            /* Background geometris */
            background:
                linear-gradient(135deg, #eeeeee 25%, transparent 25%) -20px 0/40px 40px,
                linear-gradient(225deg, #dfe2e5 25%, transparent 25%) -20px 0/40px 40px,
                linear-gradient(315deg, #f7f7f7 25%, #d9dde0 25%) 0 0/40px 40px,
                #e8e8e8;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: auto;
            padding-bottom: 30px;
        }

        /* Logo */
        .logo {
            text-align: center;
            font-size: 80px;
            padding-top: 30px;
            padding-bottom: 15px;
        }

        /* Navigasi */
        nav {
            text-align: center;
            padding-bottom: 45px;
        }

        nav a {
            color: #4b168b;
            font-size: 18px;
            font-weight: bold;
            text-decoration: underline;
        }

        /* Garis */
        hr {
            border: none;
            border-top: 1px solid #888;
            margin-bottom: 45px;
        }

        /* Judul */
        h1 {
            font-size: 38px;
            font-weight: 500;
            margin-bottom: 45px;
        }

        /* Tabel */
        table {
            border-collapse: collapse;
            width: 310px;
            background: rgba(255, 255, 255, 0.55);
            font-size: 21px;
        }

        th,
        td {
            border: 2px solid #555;
            padding: 15px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-weight: normal;
        }

        .hari {
            width: 55%;
        }

        .jam {
            width: 45%;
        }

        .catatan {
            font-style: italic;
            line-height: 1.7;
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-top: 65px;
            padding: 20px 0;
        }

        /* Tampilan HP */
        @media (max-width: 600px) {

            .container {
                width: 90%;
            }

            .logo {
                font-size: 70px;
            }

            nav a {
                font-size: 16px;
            }

            h1 {
                font-size: 35px;
            }

            table {
                width: 310px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo Jus -->
        <div class="logo">
            🥤🍊
        </div>

        <!-- Navigasi -->
        <nav>
            <a href="index.html">Beranda</a> |
            <a href="jadwal.html">Jadwal Operasional</a>
        </nav>

        <hr>

        <!-- Judul -->
        <h1>Jam Operasional Jus Kampus</h1>

        <!-- Tabel Jadwal -->
        <table>

            <tr>
                <th class="hari">Hari</th>
                <th class="jam">Jam Buka</th>
            </tr>

            <tr>
                <td>Senin -<br>Jumat</td>
                <td>09.00 -<br>22.00</td>
            </tr>

            <tr>
                <td>Sabtu -<br>Minggu</td>
                <td>10.00 -<br>24.00</td>
            </tr>

            <tr>
                <td colspan="2" class="catatan">
                    Format waktu dalam<br>
                    WIB
                </td>
            </tr>

        </table>

        <!-- Footer -->
        <footer>
            Created by Fauzan Gastian Dirizal @2026
        </footer>

    </div>

</body>
</html>
  
</body>

</html>
